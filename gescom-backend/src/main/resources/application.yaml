spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gescom_db}
    username: ${POSTGRES_USER:gescom_user_db}
    password: ${POSTGRES_PASSWORD:gescom_password_db}
    driver-class-name: org.postgresql.Driver

  # Fotos de incidencias: 10 MB por archivo y 50 MB por peticion (hasta 5 fotos). Si se supera, 413.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gescom_user_rabbit}
    password: ${RABBITMQ_PASSWORD:gescom_password_rabbit}

# Archivos subidos (fotos de incidencias). Ruta relativa a donde se arranca el back; en un servidor, una ruta absoluta.
gescom:
  uploads:
    dir: ${GESCOM_UPLOADS_DIR:uploads}

app:
  jwtSecret: ${JWT_SECRET:jwt_passssssssssssssssssssssssss}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

  # Origen(es) del front que admite CORS, separados por comas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  # INTERRUPTOR DEL CORREO
  #   enabled=false (por defecto): sin correo. Quien se registra queda validado al momento y no hace falta RabbitMQ
  #                                ni el microservicio de correo.
  #   enabled=true : el registro publica un mensaje en RabbitMQ, el microservicio gescom-mail-service envía el
  #                  enlace de verificación y el usuario no puede entrar hasta pulsarlo.
  mail:
    enabled: ${MAIL_ENABLED:false}
    front-url: ${FRONT_URL:http://localhost:5173}   # a donde apuntan los enlaces de los correos
    token-hours: ${MAIL_TOKEN_HOURS:24}             # horas de validez de cada enlace
