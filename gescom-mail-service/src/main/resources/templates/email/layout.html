<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0fdf4;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0fdf4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:12px;">
          <tr>
            <td style="padding:28px 32px 0 32px;font-size:20px;font-weight:bold;color:#059669;">{{appName}}</td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px 32px;font-size:15px;line-height:1.6;">
              {{{content}}}
            </td>
          </tr>
        </table>
        <p style="max-width:520px;margin:16px 0 0 0;font-size:12px;line-height:1.5;color:#6b7280;">
          Este mensaje se ha enviado automáticamente desde {{appName}}. Por favor, no respondas a este correo.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
